name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check-test:
    # Pinned: atomic reference replacement needs GNU mv --exchange (coreutils >= 9.5); ubuntu-24.04 ships 9.4.
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sealed research verifies source objects at the historical measuring commit.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Verify atomic exchange primitive
        # Research publication refuses replacement without it; fail here instead of deep in the test suite.
        run: |
          readlink -f /usr/bin/mv
          /usr/bin/mv --version
          version=$(/usr/bin/mv --version | sed -n '1s/^mv (GNU coreutils) \([0-9][0-9.]*\)$/\1/p')
          if [ -z "$version" ] || [ "$(printf '9.5\n%s\n' "$version" | sort -V | head -n1)" != 9.5 ]; then
            echo "::error::/usr/bin/mv must be GNU coreutils >= 9.5 (found: $(/usr/bin/mv --version | head -n1))"
            exit 1
          fi
          if ! /usr/bin/mv --help | grep -q -- '--exchange'; then
            echo "::error::/usr/bin/mv does not offer --exchange"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Test
        run: npm test
